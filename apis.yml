name: uScoop
description: uScoop appears in the 500 Global portfolio mapped to the website
  tnuck.com. The original uScoop was a 2010 college-student daily-deals startup
  (theuscoop.com, later uscoop.com); both domains are now offline or parked for
  sale, and the recorded website today is the Tuckernuck online retail
  storefront on Shopify. This profile documents the live API and agent surface
  of that recorded website, which publishes llms.txt and agents.md agent
  instructions, a Universal Commerce Protocol (UCP) merchant profile, a live
  MCP shopping endpoint, and OpenID Connect / OAuth 2.0 discovery documents
  for customer accounts.
